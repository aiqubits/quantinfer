[workspace]
resolver = "2"
members = [
    "crates/*",
    "backends/*",
    "adapters/*",
    "targets/*",
    "apps/*",
    "bindings/c",
    "bindings/wasm",
    "tools/xtask",
    "tools/quantinfer-convert",
]
default-members = [
    "crates/quantinfer",
    "apps/quantinfer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
sha2 = "0.10"
unicode-normalization = "0.1"
quantinfer = { path = "crates/quantinfer", version = "0.1.0" }
quantinfer-core = { path = "crates/quantinfer-core", version = "0.1.0" }
quantinfer-format = { path = "crates/quantinfer-format", version = "0.1.0" }
quantinfer-model = { path = "crates/quantinfer-model", version = "0.1.0" }
quantinfer-tokenizer = { path = "crates/quantinfer-tokenizer", version = "0.1.0" }
quantinfer-kernel = { path = "crates/quantinfer-kernel", version = "0.1.0" }
quantinfer-runtime = { path = "crates/quantinfer-runtime", version = "0.1.0" }
quantinfer-quant = { path = "crates/quantinfer-quant", version = "0.1.0" }
quantinfer-test-support = { path = "crates/quantinfer-test-support", version = "0.1.0" }
quantinfer-backend-cpu = { path = "backends/cpu", version = "0.1.0" }
quantinfer-backend-wgpu = { path = "backends/wgpu", version = "0.1.0" }
quantinfer-gpu-common = { path = "backends/gpu-common", version = "0.1.0" }
quantinfer-backend-metal = { path = "backends/metal", version = "0.1.0" }
quantinfer-backend-cuda = { path = "backends/cuda", version = "0.1.0" }
quantinfer-backend-ascend = { path = "backends/ascend", version = "0.1.0" }
quantinfer-backend-mock = { path = "backends/mock", version = "0.1.0" }
quantinfer-adapter-candle = { path = "adapters/candle", version = "0.1.0" }
quantinfer-adapter-lora = { path = "adapters/lora", version = "0.1.0" }
quantinfer-target-wasm = { path = "targets/wasm", version = "0.1.0" }
quantinfer-target-wasi-nn = { path = "targets/wasi-nn", version = "0.1.0" }
