name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p quantinfer-xtask -- bench
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked -p quantinfer-adapter-candle --features candle

  cpu-simd:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Compare optional SIMD kernels with the scalar reference
        shell: bash
        run: |
          cargo test --release --locked -p quantinfer-backend-cpu -p quantinfer-backend-cpu-simd \
            --features quantinfer-backend-cpu/simd -- --nocapture | tee simd.log
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then
            grep -Fx 'verified Neon' simd.log
          else
            grep -Fx 'verified Avx2' simd.log
          fi
      - run: cargo check --locked -p quantinfer-cli --features cpu-simd
