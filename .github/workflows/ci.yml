name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p quantinfer-xtask -- bench
      - run: cargo run --locked -p quantinfer-xtask -- qif-bench
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s benches -p 'test_*.py'
      - run: cargo test --locked -p quantinfer-adapter-candle --features candle
      - name: Check calibrated quantization workflow feature
        run: |
          cargo check --locked -p quantinfer-convert --features gptq,awq
          cargo test --locked -p quantinfer-convert --features gptq,awq
          cargo clippy --locked -p quantinfer-convert --features gptq,awq --all-targets -- -D warnings
      - name: Install independent golden reader hash dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev
      - name: Compare QIF Rust, Python and C golden wire reports
        run: |
          cargo run --locked -p quantinfer-format --example qif_v2_fixture -- "$RUNNER_TEMP/qif-v2-fixture.qif"
          cargo build --locked -p quantinfer-format --example qif_v2_report
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/conformance/qif_v2_reader.c -lcrypto -o "$RUNNER_TEMP/qif-v2-c-reader"
          python3 tests/conformance/qif_v2_cross_language.py --input "$RUNNER_TEMP/qif-v2-fixture.qif" \
            --rust-reader "$GITHUB_WORKSPACE/target/debug/examples/qif_v2_report" \
            --c-reader "$RUNNER_TEMP/qif-v2-c-reader"
      - name: Verify QIF tensor, chunk, alias and shard resource bounds
        run: |
          cargo build --locked -p quantinfer-format --example qif_verify --example qif_resource_fixture
          python3 tests/conformance/qif_resource_bounds.py \
            --generator "$GITHUB_WORKSPACE/target/debug/examples/qif_resource_fixture" \
            --verifier "$GITHUB_WORKSPACE/target/debug/examples/qif_verify"

  qif-cross-language:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Install independent reader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev openssl libzstd-dev liblz4-dev libjson-c-dev
          pkg-config --modversion json-c liblz4 libzstd openssl
      - name: Compare independent Python and C core profiles with native Rust
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cargo build --locked -p quantinfer-format --example qif_profile_fixtures --example qif_profile_report
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/conformance/qif_c_reference/*.c \
            $(pkg-config --cflags --libs json-c liblz4 libzstd openssl) -o "$RUNNER_TEMP/qif-c-reference"
          python3 tests/conformance/qif_profile_cross_language.py \
            --generator "$GITHUB_WORKSPACE/target/debug/examples/qif_profile_fixtures" \
            --rust-reader "$GITHUB_WORKSPACE/target/debug/examples/qif_profile_report" \
            --c-reader "$RUNNER_TEMP/qif-c-reference" \
            --corpus "$GITHUB_WORKSPACE/fuzz/corpus/qif_v2_reader"

  qif-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-07-21
          components: rust-src, rustfmt
      - run: cargo +nightly-2026-07-21 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-07-21 fetch --manifest-path fuzz/Cargo.toml --locked
      - run: cargo +nightly-2026-07-21 fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Exercise QIF parsing, codecs, verification and packages with ASan and coverage
        shell: bash
        run: |
          for target in qif_v2_reader qif_v2_package qif_v2_package_controls; do
            corpus="$RUNNER_TEMP/$target-corpus"
            mkdir -p "$corpus"
            cp "fuzz/corpus/$target/"* "$corpus/"
            cargo +nightly-2026-07-21 fuzz run "$target" "$corpus" -- \
              -runs=1024 -max_len=65536 -rss_limit_mb=1024 -timeout=5 2>&1 | tee "$target.log"
            grep -Eq 'cov: [1-9][0-9]*' "$target.log"
          done
          git diff --exit-code -- fuzz/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qif-fuzz-smoke
          path: |
            qif_v2_*.log
            fuzz/artifacts/
            ${{ runner.temp }}/qif_v2_*-corpus/
          retention-days: 14

  cpu-simd:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Compare optional SIMD kernels with the scalar reference
        shell: bash
        run: |
          cargo test --release --locked -p quantinfer-backend-cpu -p quantinfer-backend-cpu-simd \
            --features quantinfer-backend-cpu/simd -- --nocapture | tee simd.log
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then
            grep -Fx 'verified Neon' simd.log
          else
            grep -Fx 'verified Avx2' simd.log
          fi
      - run: cargo check --locked -p quantinfer-cli --features cpu-simd
