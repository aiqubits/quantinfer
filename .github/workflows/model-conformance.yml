name: Model Conformance

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      gguf_url:
        description: "Fixed external GGUF artifact URL"
        required: false
        type: string
      gguf_sha256:
        description: "SHA-256 for the external GGUF artifact"
        required: false
        type: string
      safetensors_url:
        description: "Fixed Qwen3 SafeTensors artifact URL"
        required: false
        type: string
      safetensors_sha256:
        description: "SHA-256 for the SafeTensors artifact"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "crates/quantinfer-core/**"
      - "crates/quantinfer-format/**"
      - "crates/quantinfer-model/**"
      - "crates/quantinfer-quant/**"
      - "crates/quantinfer-runtime/**"
      - "crates/quantinfer-tokenizer/**"
      - "backends/cpu/**"
      - "apps/quantinfer-cli/**"
      - "benches/real-model.sh"
      - "tools/quantinfer-convert/**"
      - "model-zoo/manifests/**"
      - "model-zoo/tokenizer/**"
      - "tests/**"
      - ".github/workflows/model-conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify pinned Qwen3 official tokenizer vectors
        run: |
          curl --fail --location --retry 3 --output /tmp/qwen3-tokenizer.json \
            "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/c1899de289a04d12100db370d81485cdf75e47ca/tokenizer.json"
          echo "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4  /tmp/qwen3-tokenizer.json" | sha256sum --check
          cargo run -p quantinfer-xtask -- tokenizer-golden \
            --tokenizer /tmp/qwen3-tokenizer.json \
            --golden model-zoo/tokenizer/qwen3-0.6b-golden.json
      - run: cargo run -p quantinfer-xtask -- conformance
      - run: cargo run -p quantinfer-xtask -- bench

  smollm2-f32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download and verify pinned SmolLM2 checkpoint
        run: |
          manifest=model-zoo/manifests/smollm2-135m.json
          source_url=$(jq -r '.source_repository + "/resolve/" + .source_revision' "$manifest")
          jq -r '(.artifacts[], .weights) | "\(.sha256)  \(.path)"' "$manifest" > smollm2.sha256
          while read -r _ path; do
            curl --fail --location --retry 3 --output "$path" "$source_url/$path"
          done < smollm2.sha256
          sha256sum --check smollm2.sha256
      - name: Convert and compare against Transformers F32 reference
        env:
          QUANTINFER_SMOLLM2_GGUF: ${{ github.workspace }}/smollm2-f32.gguf
        run: |
          cargo run --release --locked -p quantinfer-convert -- \
            --config config.json --weights model.safetensors --tokenizer tokenizer.json \
            --output "$QUANTINFER_SMOLLM2_GGUF"
          cargo test --release --locked -p quantinfer-runtime --test smollm2_conformance -- --ignored --nocapture
      - name: Record SmolLM2 F32 benchmark
        run: |
          cargo build --release --locked -p quantinfer-cli
          manifest=model-zoo/manifests/smollm2-135m.json
          bash benches/real-model.sh target/release/quantinfer-cli \
            "$(jq -r '.model_id' "$manifest")" "$(jq -r '.source_revision' "$manifest")" \
            f32 smollm2-f32.gguf > smollm2-f32-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smollm2-benchmark
          path: smollm2-f32-benchmark.txt

  external-artifact:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gguf_url != '' && inputs.gguf_sha256 != '' }}
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download and verify fixed GGUF artifact
        env:
          GGUF_URL: ${{ inputs.gguf_url }}
          GGUF_SHA256: ${{ inputs.gguf_sha256 }}
        run: |
          curl --fail --location --retry 3 --output qwen3-0.6b.gguf "$GGUF_URL"
          echo "$GGUF_SHA256  qwen3-0.6b.gguf" | sha256sum --check
      - run: cargo run -p quantinfer-cli -- inspect-gguf --input qwen3-0.6b.gguf

  qwen3-conversion:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify pinned Qwen3 checkpoint
        env:
          SAFETENSORS_URL: ${{ inputs.safetensors_url }}
          SAFETENSORS_SHA256: ${{ inputs.safetensors_sha256 }}
        run: |
          manifest=model-zoo/manifests/qwen3-0.6b.json
          source_url=$(jq -r '.source_repository + "/resolve/" + .source_revision' "$manifest")
          expected_sha=$(jq -r '.weights.sha256' "$manifest")
          if [[ -n "$SAFETENSORS_SHA256" && "$SAFETENSORS_SHA256" != "$expected_sha" ]]; then
            echo "The override must provide the pinned Qwen3 checkpoint" >&2
            exit 1
          fi
          weights_url=${SAFETENSORS_URL:-$(jq -r '.weights.url' "$manifest")}
          mkdir qwen3
          jq -r '.artifacts[] | "\(.sha256)  qwen3/\(.path)"' "$manifest" > qwen3-source.sha256
          while read -r _ path; do
            curl --fail --location --retry 3 --output "$path" "$source_url/${path#qwen3/}"
          done < qwen3-source.sha256
          curl --fail --location --retry 3 --output qwen3/model.safetensors "$weights_url"
          printf '%s  qwen3/model.safetensors\n' "$expected_sha" >> qwen3-source.sha256
          sha256sum --check qwen3-source.sha256
      - name: Compute independent Transformers F32 reference
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0'
          python -m pip install 'transformers==4.57.6'
          python tests/conformance/qwen3_reference.py qwen3 > qwen3-reference.json
      - name: Convert and inspect F32, Q8_0 and Q4_0 GGUF
        run: |
          cargo build --release --locked -p quantinfer-convert -p quantinfer-cli
          for variant in f32 q8_0 q4_0; do
            options=()
            if [[ "$variant" != f32 ]]; then options+=(--quantize "$variant"); fi
            target/release/quantinfer-convert --config qwen3/config.json \
              --weights qwen3/model.safetensors --tokenizer qwen3/tokenizer.json \
              --output "qwen3-$variant.gguf" "${options[@]}"
            target/release/quantinfer-cli inspect-gguf --input "qwen3-$variant.gguf" \
              > "qwen3-$variant.inventory"
          done
          sha256sum qwen3-f32.gguf qwen3-q8_0.gguf qwen3-q4_0.gguf > qwen3-gguf.sha256
      - name: Gate real Qwen3 logits, generation and quantization error
        shell: bash
        env:
          QUANTINFER_QWEN3_REFERENCE: ${{ github.workspace }}/qwen3-reference.json
          QUANTINFER_QWEN3_F32: ${{ github.workspace }}/qwen3-f32.gguf
          QUANTINFER_QWEN3_Q8: ${{ github.workspace }}/qwen3-q8_0.gguf
        run: |
          cargo test --release --locked -p quantinfer-runtime --test qwen3_conformance -- --ignored --nocapture \
            | tee qwen3-conformance.log
      - name: Record Qwen3 F32, Q8_0 and Q4_0 benchmarks
        run: |
          manifest=model-zoo/manifests/qwen3-0.6b.json
          for variant in f32 q8_0 q4_0; do
            bash benches/real-model.sh target/release/quantinfer-cli \
              "$(jq -r '.model_id' "$manifest")" "$(jq -r '.source_revision' "$manifest")" \
              "$variant" "qwen3-$variant.gguf" > "qwen3-$variant-benchmark.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-conformance-report
          path: |
            qwen3-source.sha256
            qwen3-gguf.sha256
            qwen3-*.inventory
            qwen3-reference.json
            qwen3-conformance.log
            qwen3-*-benchmark.txt
