name: llama.cpp Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/quantinfer-cli/**"
      - "backends/cpu/**"
      - "backends/cpu-simd/**"
      - "crates/quantinfer/**"
      - "crates/quantinfer-core/**"
      - "crates/quantinfer-kernel/**"
      - "crates/quantinfer-quant/**"
      - "crates/quantinfer-runtime/**"
      - "benches/llama-cpp-compare.py"
      - "benches/real-model.sh"
      - "model-zoo/manifests/smollm2-135m.json"
      - ".github/workflows/llama-cpp-compare.yml"
      - "Cargo.lock"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: vendor/llama.cpp
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned llama.cpp and QuantInfer
        run: |
          cmake -S vendor/llama.cpp -B "$RUNNER_TEMP/llama" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/llama" --target llama-bench llama-quantize --parallel 3
          cargo build --release --locked -p quantinfer-cli
      - name: Compare decode throughput on the pinned SmolLM2 artifact
        run: |
          manifest=model-zoo/manifests/smollm2-135m.json
          curl --fail --location --retry 3 --output smollm2-f16.gguf \
            "$(jq -r '.external_f16_gguf.url' "$manifest")"
          printf '%s  smollm2-f16.gguf\n' "$(jq -r '.external_f16_gguf.sha256' "$manifest")" | sha256sum --check
          "$RUNNER_TEMP/llama/bin/llama-quantize" smollm2-f16.gguf smollm2-q8_0.gguf Q8_0 1
          python benches/llama-cpp-compare.py \
            --cli target/release/quantinfer-cli \
            --llama-bench "$RUNNER_TEMP/llama/bin/llama-bench" \
            --model smollm2-q8_0.gguf \
            --threads 1,2,4 \
            --output llama-cpp-compare.json
          cat llama-cpp-compare.json >> "$GITHUB_STEP_SUMMARY"
