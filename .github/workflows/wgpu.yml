name: WGPU Conformance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/quantinfer-cli/**"
      - "backends/wgpu/**"
      - "backends/gpu-common/**"
      - "backends/metal/**"
      - "backends/cpu/**"
      - "crates/quantinfer-core/**"
      - "crates/quantinfer-format/**"
      - "crates/quantinfer-kernel/**"
      - "crates/quantinfer-model/**"
      - "crates/quantinfer-quant/**"
      - "crates/quantinfer-runtime/**"
      - "crates/quantinfer-tokenizer/**"
      - "crates/quantinfer/**"
      - "model-zoo/manifests/smollm2-135m.json"
      - "Cargo.lock"
      - ".github/workflows/wgpu.yml"

jobs:
  software-vulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install a Vulkan compute adapter
        id: vulkan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit | grep -q .; then
            echo 'A software Vulkan ICD is already available.'
            exit 0
          fi
          installed=0
          for attempt in 1 2 3; do
            echo "Installing Vulkan software driver (attempt ${attempt}/3)"
            if timeout 90s sudo apt-get -o Acquire::Retries=1 update -qq \
              && timeout 90s sudo apt-get -o Acquire::Retries=1 install --no-install-recommends -y \
                libvulkan1 mesa-vulkan-drivers; then
              installed=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [[ "$installed" != 1 ]]; then
            echo 'Unable to install the software Vulkan driver after three attempts.' >&2
            exit 1
          fi
          test -n "$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
      - name: Fetch and verify SmolLM2
        if: steps.vulkan.outcome == 'success'
        run: |
          manifest=model-zoo/manifests/smollm2-135m.json
          curl --fail --location --retry 3 --output smollm2-f16.gguf \
            "$(jq -r '.external_f16_gguf.url' "$manifest")"
          printf '%s  smollm2-f16.gguf\n' "$(jq -r '.external_f16_gguf.sha256' "$manifest")" | sha256sum --check
      - name: Compare WGSL kernels and model generation against CPU
        if: steps.vulkan.outcome == 'success'
        shell: bash
        env:
          QUANTINFER_WGPU_SOFTWARE: "1"
          QUANTINFER_WGPU_GGUF: ${{ github.workspace }}/smollm2-f16.gguf
        run: |
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$VK_DRIVER_FILES"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wgpu-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          cargo test --release --locked -p quantinfer-backend-wgpu --features native \
            --lib -- --ignored
          cargo test --release --locked -p quantinfer-backend-wgpu --features native \
            --test native -- --ignored --nocapture --test-threads=1
          cargo build --release --locked -p quantinfer-cli --features wgpu
          target/release/quantinfer-cli generate --backend wgpu --input smollm2-f16.gguf \
            --prompt 'The capital of France is' --max-new-tokens 3 --max-sequence-length 64 \
            | grep -Fx 'generated_tokens=[260, 3575, 282]'
      - name: Report unavailable software Vulkan adapter
        if: steps.vulkan.outcome != 'success'
        run: echo 'Software Vulkan conformance was skipped because the runner could not provide an llvmpipe ICD.'
