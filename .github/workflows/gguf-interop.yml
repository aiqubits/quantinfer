name: GGUF Interoperability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/quantinfer-cli/**"
      - "backends/cpu/**"
      - "crates/quantinfer/**"
      - "crates/quantinfer-core/**"
      - "crates/quantinfer-format/**"
      - "crates/quantinfer-kernel/**"
      - "crates/quantinfer-model/**"
      - "crates/quantinfer-quant/**"
      - "crates/quantinfer-runtime/**"
      - "crates/quantinfer-tokenizer/**"
      - "tools/quantinfer-convert/**"
      - "model-zoo/manifests/smollm2-135m.json"
      - "tests/conformance/gguf_interop.py"
      - ".github/workflows/gguf-interop.yml"
      - "Cargo.lock"

jobs:
  llama-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: vendor/llama.cpp
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Build pinned llama.cpp and QuantInfer
        run: |
          cmake -S vendor/llama.cpp -B "$RUNNER_TEMP/llama" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/llama" --target llama-server llama-quantize --parallel 3
          python -m pip install ./vendor/llama.cpp/gguf-py
          cargo build --release --locked -p quantinfer-cli -p quantinfer-convert
      - name: Verify external Q8_0 and Q4_0 in both runtimes
        run: |
          manifest=model-zoo/manifests/smollm2-135m.json
          curl --fail --location --retry 3 --output smollm2-f16.gguf \
            "$(jq -r '.external_f16_gguf.url' "$manifest")"
          printf '%s  smollm2-f16.gguf\n' "$(jq -r '.external_f16_gguf.sha256' "$manifest")" | sha256sum --check
          for dtype in Q8_0 Q4_0; do
            model="smollm2-external-${dtype}.gguf"
            "$RUNNER_TEMP/llama/bin/llama-quantize" smollm2-f16.gguf "$model" "$dtype" 1
            python tests/conformance/gguf_interop.py --cli target/release/quantinfer-cli \
              --server "$RUNNER_TEMP/llama/bin/llama-server" --model "$model" --dtype "$dtype"
          done
      - name: Verify QuantInfer GGML exports in both runtimes
        shell: bash
        run: |
          manifest=model-zoo/manifests/smollm2-135m.json
          source_url=$(jq -r '.source_repository + "/resolve/" + .source_revision' "$manifest")
          jq -r '(.artifacts[], .weights) | "\(.sha256)  \(.path)"' "$manifest" > smollm2.sha256
          while read -r _ path; do
            curl --fail --location --retry 3 --output "$path" "$source_url/$path"
          done < smollm2.sha256
          sha256sum --check smollm2.sha256
          for dtype in F32 Q8_0 Q4_0; do
            package="smollm2-quantinfer-${dtype}"
            mkdir "$package"
            quantization=()
            if [[ "$dtype" != F32 ]]; then quantization=(--quantize "${dtype,,}"); fi
            target/release/quantinfer-convert --config config.json --weights model.safetensors \
              --tokenizer tokenizer.json --gguf-layout ggml --tokenizer-pre smollm \
              --output "$package/model.gguf" --manifest "$package/manifest.json" "${quantization[@]}"
            sha256sum "$package/model.gguf"
            mkdir "$package/profiles"
            jq -n --arg scheme "${dtype,,}" '{model_variant:"cpu-scalar", quantization_variant:$scheme,
              runtime_provider:"cpu-scalar", kernel_provider:"cpu-scalar", context_length:64,
              thread_count:2, memory_budget_bytes:2147483648}' > "$package/profiles/conformance.json"
            (cd "$package" && sha256sum profiles/conformance.json >> checksums.sha256)
            profile_sha=$(sha256sum "$package/profiles/conformance.json" | cut -d ' ' -f 1)
            jq --arg sha "$profile_sha" '.checksums["profiles/conformance.json"] = $sha' \
              "$package/manifest.json" > "$package/manifest.tmp"
            mv "$package/manifest.tmp" "$package/manifest.json"
            python tests/conformance/gguf_interop.py --cli target/release/quantinfer-cli \
              --server "$RUNNER_TEMP/llama/bin/llama-server" --model "$package/model.gguf" --dtype "$dtype" \
              --metadata-reference smollm2-f16.gguf --package "$package" --inference-profile conformance
          done
