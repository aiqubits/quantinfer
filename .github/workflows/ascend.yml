name: Ascend CANN Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backends/ascend/**"
      - "Cargo.lock"
      - ".github/workflows/ascend.yml"

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - run: cargo test --locked -p quantinfer-backend-ascend --features native

  native:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.QUANTINFER_ASCEND_RUNNER != '' }}
    runs-on: [self-hosted, '${{ vars.QUANTINFER_ASCEND_RUNNER }}']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Probe CANN ACL runtime
        env:
          ASCEND_ACL_LIBRARY: ${{ vars.ASCEND_ACL_LIBRARY }}
          ASCEND_OP_LIBRARY: ${{ vars.ASCEND_OP_LIBRARY }}
        run: cargo test --locked -p quantinfer-backend-ascend --features native -- --ignored
