[package]
name = "quantinfer-backend-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quantinfer-core = { workspace = true }
quantinfer-kernel = { workspace = true }
quantinfer-backend-cpu = { workspace = true, optional = true }
quantinfer-runtime = { workspace = true, optional = true }
quantinfer-gpu-common = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytemuck = { version = "1", optional = true }
pollster = { version = "1", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"], optional = true }

[features]
native = [
    "dep:bytemuck", "dep:pollster", "dep:wgpu",
    "dep:quantinfer-backend-cpu", "dep:quantinfer-runtime", "dep:quantinfer-gpu-common",
]

[dev-dependencies]
quantinfer-format.workspace = true
