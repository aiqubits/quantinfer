[package]
name = "quantinfer-convert"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
ggml = ["dep:quantinfer-adapter-ggml"]
gptq = ["dep:quantinfer", "dep:quantinfer-adapter-gptq", "dep:sha2"]
awq = ["dep:quantinfer", "dep:quantinfer-adapter-awq", "dep:quantinfer-backend-cpu", "dep:sha2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
quantinfer-adapter-ggml = { path = "../../adapters/ggml", version = "0.1.0", features = ["external"], optional = true }
quantinfer-core = { workspace = true }
quantinfer-format = { workspace = true }
quantinfer-model = { workspace = true }
quantinfer-quant = { workspace = true }
quantinfer = { workspace = true, optional = true }
quantinfer-adapter-gptq = { workspace = true, optional = true }
quantinfer-adapter-awq = { workspace = true, optional = true }
quantinfer-backend-cpu = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
